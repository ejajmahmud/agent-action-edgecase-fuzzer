[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-action-edgecase-fuzzer"
version = "0.1.0"
description = "Mutational fuzzer injecting malformed parameters, unicode edge-cases, and boundary integers into agent tool definitions"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-action-edgecase-fuzzer = "agent_action_edgecase_fuzzer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_action_edgecase_fuzzer*"]
